<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #f3e5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            width: 420px;
            background: #ffffff;
            padding: 30px 25px;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #4caf50;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background: #45a049;
        }

        #result {
            margin-top: 18px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1565c0;
            min-height: 24px;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <h2>Grade Calculator</h2>
        <input type="number" id="m1" placeholder="enter a mark" required>
        <input type="number" id="m2" placeholder="enter a mark" required>
        <input type="number" id="m3" placeholder="enter a mark" required>
        <input type="number" id="m4" placeholder="enter a mark" required>
        <input type="number" id="m5" placeholder="enter a mark" required>
        <button onclick="calculateGrade()">Calculate Grade</button>
        <p id="result"></p>
    </div>
    <script>
        function calculateGrade(){
            var m1 = Number(document.getElementById("m1").value);
            var m2 = Number(document.getElementById("m2").value);
            var m3 = Number(document.getElementById("m3").value);
            var m4 = Number(document.getElementById("m4").value);
            var m5 = Number(document.getElementById("m5").value);

            var total = m1 + m2 + m3 + m4 + m5;
            var percentage = (total / 500) * 100;

            var grade;

            if (percentage >= 90) {
                grade = "A+";
            } else if (percentage >= 80) {
                grade = "A";
            } else if (percentage >= 70) {
                grade = "B";
            } else if (percentage >= 60) {
                grade = "C";
            } else if (percentage >= 50) {
                grade = "D";
            } else {
                grade = "F";
            }

            document.getElementById("result").textContent = "Grade: " + grade;
        }
    </script>
</body>
</html>
